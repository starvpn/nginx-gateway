name: Build Docker Image

on:
  push:
    branches:
      - gateway
    tags:
      - 'v*'
  pull_request:
    paths:
      - '**/*.go'
      - 'app/**'
      - 'docs/package.json'
      - 'go.mod'
      - 'go.sum'
      - 'package.json'
      - 'pnpm-lock.yaml'
      - 'pnpm-workspace.yaml'
      - 'resources/docker/**'
      - '.github/docker/**'
      - '.github/workflows/build.yml'
  workflow_dispatch:
    inputs:
      image_tag:
        description: Extra Docker tag to publish
        required: false
        type: string

permissions:
  contents: read

env:
  IMAGE_NAME: ${{ vars.DOCKERHUB_IMAGE || 'nginx-ui' }}
  PLATFORMS: ${{ vars.DOCKER_PLATFORMS || 'linux/amd64,linux/arm64' }}
  GO_IMAGE: ${{ vars.GO_IMAGE || 'golang:1.26.2-bookworm' }}
  NODE_IMAGE: ${{ vars.NODE_IMAGE || 'node:current-bookworm' }}
  PNPM_VERSION: ${{ vars.PNPM_VERSION || '11.1.1' }}
  OPENRESTY_IMAGE: ${{ vars.OPENRESTY_IMAGE || 'openresty/openresty:bookworm' }}
  LUA_RESTY_WAF_REF: ${{ vars.LUA_RESTY_WAF_REF || '5e701b6' }}
  S6_OVERLAY_VERSION: ${{ vars.S6_OVERLAY_VERSION || '3.2.1.0' }}

jobs:
  docker:
    name: Build and publish Docker image
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Validate Docker Hub settings
        if: github.event_name != 'pull_request'
        run: |
          if [ "${IMAGE_NAME}" = "nginx-ui" ]; then
            echo "Set repository variable DOCKERHUB_IMAGE, for example: your-dockerhub-user/nginx-ui" >&2
            exit 1
          fi

      - name: Set build time
        run: echo "BUILD_TIME=$(date +%s)" >> "$GITHUB_ENV"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Login to Docker Hub
        if: github.event_name != 'pull_request'
        uses: docker/login-action@v4
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME || secrets.DOCKERHUB_USER }}
          password: ${{ secrets.DOCKERHUB_TOKEN }}

      - name: Docker metadata
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=semver,pattern={{raw}}
            type=sha,prefix=sha-
            type=raw,value=latest,enable=${{ github.ref == 'refs/heads/main' || startsWith(github.ref, 'refs/tags/v') }}
            type=raw,value=${{ inputs.image_tag }},enable=${{ github.event_name == 'workflow_dispatch' && inputs.image_tag != '' }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v7
        with:
          context: .
          file: .github/docker/Dockerfile
          platforms: ${{ env.PLATFORMS }}
          push: ${{ github.event_name != 'pull_request' }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            GO_IMAGE=${{ env.GO_IMAGE }}
            NODE_IMAGE=${{ env.NODE_IMAGE }}
            PNPM_VERSION=${{ env.PNPM_VERSION }}
            OPENRESTY_IMAGE=${{ env.OPENRESTY_IMAGE }}
            LUA_RESTY_WAF_REF=${{ env.LUA_RESTY_WAF_REF }}
            S6_OVERLAY_VERSION=${{ env.S6_OVERLAY_VERSION }}
            BUILD_TIME=${{ env.BUILD_TIME }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
